max_steps = 150
batch_size = 1024
seq_len = 4096
rollouts_per_example = 32
mask_truncated_completions = false
seed = 2001

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"

[wandb]
platform = "tensorboard"
project = "AS_to_100"
name = "orch_which_topk_and_support?"

[[env]]
id = "alphabet-sort"
args = { min_turns = 2, max_turns = 2, seed=2001 }

[sampling]
max_tokens = 64
temperature = 1.0
seed = 2001

[buffer]
seed = 2001

[wandb.log_extras]
interval = 50

[eval]
interval = 10
rollouts_per_example = 4
num_examples = 128

[[eval.env]]
id = "alphabet-sort"
args = {"min_turns" = 2, "max_turns"= 2, "seed"= 2001}

[eval.sampling]
max_tokens = 64
temperature = 1.0
top_p = 1.0
top_k = -1
seed = 2001

[ckpt]
interval = 5