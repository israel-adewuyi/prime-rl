max_steps = 2
seq_len = 256

[run]
name = "lfm25-gradient-stats"

[model]
name = "LiquidAI/LFM2.5-230M"

[weight_broadcast]
type = "filesystem"

[trainer]
matmul_precision = "highest"

[trainer.monitors.file]

[trainer.model]
attn = "flash_attention_2"
compile = "None"
ac = "None"
ac_offloading = "None"
optim_cpu_offload = false
cp = 1
ep = 1
fused_lm_head_token_chunk_size = 64

[trainer.model.fusions]
enabled = []

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.gradient_capture]
steps = [1, 2]
verify = true

[orchestrator]
batch_size = 8

[orchestrator.renderer]
name = "default"

[orchestrator.train]
group_size = 4

[orchestrator.train.algo]
type = "grpo"

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 64

[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[inference.vllm]
enforce_eager = true
dtype = "bfloat16"
tensor_parallel_size = 1
max_model_len = 256
max_num_seqs = 16
gpu_memory_utilization = 0.5

[ckpt]
interval = 1
save_gradients_and_updates = true

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
