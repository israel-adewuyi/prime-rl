max_steps = 10

[run]
name = "exp4-qwen25"
[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
[weight_broadcast]
type = "filesystem"
[trainer]
matmul_precision = "highest"
[trainer.model]
seq_len = 16384
attn = "flash_attention_2"
compile = "None"
ac = "None"
ac_offloading = "None"
optim_cpu_offload = false
cp = 1
ep = 1
fused_lm_head_token_chunk_size = 8192
[trainer.model.fusions]
enabled = []
[trainer.optim]
type = "adamw"
lr = 1e-5
[trainer.loss]
type = "ipo"
eps = 0.3
max_importance_ratio = 10000.0
adv_tau = 1.0
[orchestrator]
batch_size = 32
seq_len = 16384
[orchestrator.concurrency]
initial_inflight = 128
min_inflight = 128
max_inflight = 128
[orchestrator.renderer]
name = "default"
[orchestrator.train]
group_size = 16
[orchestrator.train.algo]
type = "grpo"
[orchestrator.train.select]
exclude.idx = ["0:32"]
[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 128
[[orchestrator.train.source]]
name = "reverse-text"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
[orchestrator.eval]
interval = 10
skip_first_step = false
group_size = 1
[orchestrator.eval.select]
include.idx = ["0:32"]
[orchestrator.eval.sampling]
temperature = 0.0
max_completion_tokens = 128
[[orchestrator.eval.source]]
name = "reverse-text-heldout"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
[inference.vllm]
seed = 42
enforce_eager = true
dtype = "bfloat16"
tensor_parallel_size = 1
max_model_len = 4096
max_num_seqs = 128
gpu_memory_utilization = 0.10
enable_prefix_caching = false
[monitors.file]
[deployment]
num_train_gpus = 1
num_infer_gpus = 1
